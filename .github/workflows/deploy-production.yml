name: Deploy public website

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: public-web-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy and verify the public website
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: Production
      url: ${{ steps.deploy.outputs.url }}
    defaults:
      run:
        working-directory: yocontrolo-web

    steps:
      - name: Checkout the exact revision approved by CI
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: yocontrolo-web/package-lock.json

      - name: Require the isolated Vercel credentials
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          test -n "${VERCEL_ORG_ID}" || { echo "::error::Missing VERCEL_ORG_ID"; exit 1; }
          test -n "${VERCEL_PROJECT_ID}" || { echo "::error::Missing VERCEL_PROJECT_ID"; exit 1; }
          test -n "${VERCEL_TOKEN}" || { echo "::error::Missing VERCEL_TOKEN"; exit 1; }

      - name: Install the locked dependency tree
        run: npm ci --no-audit --no-fund

      - name: Deploy the exact approved commit through the project-scoped API
        id: deploy
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: >-
          node scripts/deploy-vercel-api.mjs
          "${{ github.event.workflow_run.head_sha }}"
          "${{ github.event.repository.id }}"

      - name: Verify the public domain after deployment
        run: npm run test:deployment -- https://www.yocontrolo.net
