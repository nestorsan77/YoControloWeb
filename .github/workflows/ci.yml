name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: public-web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: yocontrolo-web

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: yocontrolo-web/package-lock.json

      - name: Install the locked dependency tree
        run: npm ci --no-audit --no-fund

      - name: Reject high and critical vulnerabilities
        run: npm audit --audit-level=high

  quality:
    name: Public website quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: yocontrolo-web

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: yocontrolo-web/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run brand and content regressions
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build production website
        run: npm run build

      - name: Test the production server
        run: npm run test:smoke

  secrets:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Gitleaks CLI
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "${RUNNER_TEMP}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" \
            --output "${RUNNER_TEMP}/gitleaks-checksums.txt"
          cd "${RUNNER_TEMP}"
          grep "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks-checksums.txt \
            | sha256sum --check --strict
          tar --extract --gzip --file "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          chmod +x gitleaks
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"

      - name: Scan repository for secrets
        run: gitleaks git --redact --verbose --no-banner .

  release-gate:
    name: Release gate
    if: always()
    runs-on: ubuntu-latest
    needs:
      - quality
      - dependencies
      - secrets

    steps:
      - name: Require every CI layer to pass
        run: |
          test "${{ needs.quality.result }}" = "success"
          test "${{ needs.dependencies.result }}" = "success"
          test "${{ needs.secrets.result }}" = "success"
